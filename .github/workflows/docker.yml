name: Build Docker Image

on:
  push:
    branches: [ "master", "dev" ]
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  release-contract:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Require tag to match packaged version
        if: github.ref_type == 'tag'
        run: >-
          python scripts/package_release.py
          --validate-release-tag "${{ github.ref_name }}"

  build:
    needs: release-contract
    name: Build and smoke ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=

      - name: Build Docker image once for smoke and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test exact built image runtime imports
        env:
          RELEASE_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_IMAGE_ID"
          docker image inspect "$RELEASE_IMAGE_ID" >/dev/null
          docker run --rm --entrypoint python "$RELEASE_IMAGE_ID" -c \
            "from importlib import metadata; from pathlib import Path; import aiofiles, asyncssh, bcrypt, cryptography, dotenv, fastapi, httpx, multipart, numpy, onnxruntime, PIL, psutil, pydantic, pydantic_settings, requests, typing_extensions, tzdata, uvicorn; assert metadata.version('bcrypt') == '5.0.0'; assert numpy.__version__ == '2.4.3'; assert onnxruntime.__version__ == '1.24.3'; assert Path('/app/THIRD_PARTY_NOTICES.md').is_file(); assert Path('/app/THIRD_PARTY_LICENSES/bcrypt/LICENSE').is_file(); passphrase = 'genbox-runtime-smoke-only'; private_key = asyncssh.generate_private_key('ssh-ed25519'); encrypted_key = private_key.export_private_key('openssh', passphrase); assert asyncssh.import_private_key(encrypted_key, passphrase).get_algorithm() == 'ssh-ed25519'; import main; print('docker runtime import smoke passed')"

      - name: Smoke test exact built image over HTTP
        timeout-minutes: 3
        env:
          RELEASE_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: bash .github/scripts/docker-release-http-smoke.sh

      - name: Save smoke-tested Docker image without rebuilding
        env:
          RELEASE_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_IMAGE_ID"
          docker image inspect "$RELEASE_IMAGE_ID" >/dev/null
          local_image_tag="genbox-release:linux-${{ matrix.architecture }}"
          docker tag "$RELEASE_IMAGE_ID" "$local_image_tag"
          docker save --output "$RUNNER_TEMP/genbox-release-image-${{ matrix.architecture }}.tar" "$local_image_tag"
          printf '%s\n' "$RELEASE_IMAGE_ID" > "$RUNNER_TEMP/genbox-release-image-${{ matrix.architecture }}.id"
          test -s "$RUNNER_TEMP/genbox-release-image-${{ matrix.architecture }}.tar"

      - name: Upload exact smoke-tested Docker image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genbox-release-image-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/genbox-release-image-${{ matrix.architecture }}.tar
            ${{ runner.temp }}/genbox-release-image-${{ matrix.architecture }}.id
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  push:
    name: Publish exact smoke-tested multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: push-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=

      - name: Download exact smoke-tested AMD64 Docker image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: genbox-release-image-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/genbox-release-image-amd64

      - name: Download exact smoke-tested ARM64 Docker image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: genbox-release-image-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/genbox-release-image-arm64

      - name: Load and verify exact smoke-tested Docker images
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            artifact_dir="$RUNNER_TEMP/genbox-release-image-$architecture"
            expected_id="$(cat "$artifact_dir/genbox-release-image-$architecture.id")"
            docker load --input "$artifact_dir/genbox-release-image-$architecture.tar"
            test "$(docker image inspect --format '{{.Id}}' "genbox-release:linux-$architecture")" = "$expected_id"
          done

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push smoke-tested platform images and create manifests without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.push-meta.outputs.tags }}
        run: |
          set -euo pipefail
          pushed=0
          while IFS= read -r tag; do
            test -n "$tag" || continue
            for architecture in amd64 arm64; do
              platform_tag="$tag-$architecture"
              docker tag "genbox-release:linux-$architecture" "$platform_tag"
              docker push "$platform_tag"
            done
            docker buildx imagetools create --tag "$tag" "$tag-amd64" "$tag-arm64"
            docker buildx imagetools inspect "$tag"
            pushed=$((pushed + 1))
          done <<< "$IMAGE_TAGS"
          test "$pushed" -gt 0
